<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlumberManager Widget Test</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #f7fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .widget-container {
      width: 100%;
      height: 500px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      overflow: hidden;
      margin-top: 16px;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      background: white;
      cursor: pointer;
    }
    button:hover {
      background: #f7fafc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PlumberManager Embeddable Widget Test Page</h1>
    <p>This page loads the compiled <code>plumber-viewer.umd.js</code> and renders a sample graph inside a Shadow DOM container.</p>
    
    <div id="my-pipeline" class="widget-container"></div>

    <div class="controls">
      <button id="focus-btn">Focus on "Animation"</button>
      <button id="isolate-btn">Isolate "LookDev"</button>
    </div>
  </div>

  <!-- Load the built widget locally -->
  <script src="./dist/widget/plumber-viewer.umd.js"></script>

  <script>
    // Sample graph data for testing
    const sampleData = {
      NODES: {
        "LookDev": {
          "preset": "node_preset_1",
          "position": [100, 150],
          "alternate": true,
          "attributes": [
            { "name": "assets", "plug": true, "socket": false, "dataType": "usd" }
          ],
          "metadata": {
            "process_details": "# Look Development Process\n\nThis process defines material styling, surfacing textures, and shading parameters for the assets.\n\n### Outputs:\n- **assets**: Outputs standard USD schema textures and materials."
          }
        },
        "Animation": {
          "preset": "node_preset_1",
          "position": [400, 150],
          "alternate": true,
          "attributes": [
            { "name": "assets", "plug": false, "socket": true, "dataType": "usd" },
            { "name": "cache", "plug": true, "socket": false, "dataType": "kiko" }
          ],
          "metadata": {
            "process_details": "# Animation Process\n\nThis process handles character animations, skeletal rigs, and keyframe modifications.\n\n### Inputs:\n- **assets**: Receives LookDev geometries.\n\n### Outputs:\n- **cache**: Outputs animated Kiko curves cache."
          }
        }
      },
      CONNECTIONS: [
        ["LookDev.assets", "Animation.assets"]
      ]
    };

    // Initialize Widget
    const viewer = PlumberViewer.create('#my-pipeline', {
      data: sampleData,
      theme: 'dark',
      isolation: true,
      documentation: true
    });

    // Hook up API controls
    document.getElementById('focus-btn').onclick = () => {
      viewer.focusNode('Animation');
    };

    document.getElementById('isolate-btn').onclick = () => {
      viewer.showIsolation('LookDev');
    };

    // Listen to events
    viewer.on('node:click', (nodeName) => {
      console.log('Node clicked inside host page context:', nodeName);
    });
  </script>
</body>
</html>
